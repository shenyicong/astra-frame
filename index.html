<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>ASTRA FRAME · 星际战甲</title>
<style>
  /* ============ 基础 ============ */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #04060b;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    color: #cfe3ff;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  #game { display: block; width: 100%; height: 100%; }

  /* ============ HUD 容器 ============ */
  #hud {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 10;
    font-variant-numeric: tabular-nums;
  }

  /* 四角装饰线 */
  .corner {
    position: absolute; width: 54px; height: 54px;
    border: 2px solid rgba(0, 240, 255, .32);
  }
  .corner.tl { top: 18px; left: 18px; border-right: 0; border-bottom: 0; }
  .corner.tr { top: 18px; right: 18px; border-left: 0; border-bottom: 0; }
  .corner.bl { bottom: 18px; left: 18px; border-right: 0; border-top: 0; }
  .corner.br { bottom: 18px; right: 18px; border-left: 0; border-top: 0; }

  /* ============ 准星 ============ */
  #crosshair {
    position: absolute; left: 50%; top: 50%;
    width: 26px; height: 26px;
    transform: translate(-50%, -50%);
    opacity: .9;
  }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: #7df9ff;
    box-shadow: 0 0 6px rgba(0, 240, 255, .9);
  }
  #crosshair::before { left: 50%; top: 0; width: 1.5px; height: 100%; transform: translateX(-50%); }
  #crosshair::after { top: 50%; left: 0; height: 1.5px; width: 100%; transform: translateY(-50%); }
  #crosshair.hit::before, #crosshair.hit::after { background: #ff4d6d; box-shadow: 0 0 10px #ff4d6d; }

  /* ============ 左下：生命 / 护盾 ============ */
  #vitals {
    position: absolute; left: 34px; bottom: 34px;
    width: 264px;
  }
  .bar-label {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 10px; letter-spacing: 2.4px;
    color: #5f7b9e; margin-bottom: 5px;
  }
  .bar-label b { font-size: 12px; color: #9dd7f0; font-weight: 600; }
  .bar {
    height: 7px; background: rgba(10, 20, 34, .82);
    border: 1px solid rgba(0, 240, 255, .22);
    margin-bottom: 12px; overflow: hidden;
    position: relative;
  }
  .bar > i {
    display: block; height: 100%; width: 100%;
    transition: width .12s linear;
    will-change: width;
  }
  #shieldFill { background: linear-gradient(90deg, #0a7ea4, #25d6ff); box-shadow: 0 0 10px rgba(37, 214, 255, .55); }
  #healthFill { background: linear-gradient(90deg, #7a1d2c, #ff4d6d); box-shadow: 0 0 10px rgba(255, 77, 109, .5); }

  /* ============ 右下：弹药 / 武器 ============ */
  #weapon {
    position: absolute; right: 34px; bottom: 34px;
    text-align: right;
  }
  #weaponName { font-size: 10px; letter-spacing: 2.4px; color: #5f7b9e; margin-bottom: 4px; }
  #ammo {
    font-family: Consolas, "Courier New", monospace;
    font-size: 34px; line-height: 1; color: #d8f6ff;
    text-shadow: 0 0 14px rgba(0, 240, 255, .6);
  }
  #ammo span { font-size: 15px; color: #4d6b8a; }
  #ammo.low { color: #ff8a5c; text-shadow: 0 0 14px rgba(255, 100, 60, .7); }

  /* ============ 左上：小地图 ============ */
  #mapWrap {
    position: absolute; left: 34px; top: 34px;
    width: 168px;
  }
  #minimap {
    width: 168px; height: 168px; display: block;
    border: 1px solid rgba(0, 240, 255, .28);
    background: rgba(4, 8, 14, .85);
    box-shadow: inset 0 0 30px rgba(0, 240, 255, .07);
  }
  #explored {
    margin-top: 7px; font-size: 10px; letter-spacing: 2px; color: #5f7b9e;
  }
  #explored b { color: #00f0ff; font-weight: 600; }

  /* ============ 右上：战况 ============ */
  #status {
    position: absolute; right: 34px; top: 34px;
    text-align: right; font-size: 10px; letter-spacing: 2.2px; color: #5f7b9e;
    line-height: 2;
  }
  #status b { color: #9dd7f0; font-weight: 600; font-size: 12px; }
  #status .kill b { color: #ff8a5c; }

  /* ============ 帧率 ============ */
  #perf {
    position: absolute; left: 50%; bottom: 26px;
    transform: translateX(-50%);
    font-family: Consolas, monospace; font-size: 11px;
    color: #3f5a78; letter-spacing: 1px;
  }
  #perf b { color: #00f0ff; }

  /* ============ 伤害闪屏 ============ */
  #damageFlash {
    position: fixed; inset: 0; pointer-events: none; z-index: 9;
    background: radial-gradient(circle at 50% 50%, transparent 45%, rgba(255, 30, 60, .55) 100%);
    opacity: 0; transition: opacity .28s ease-out;
  }

  #toast {
    position: fixed; left: 50%; bottom: 12%; transform: translateX(-50%) translateY(8px);
    z-index: 11; pointer-events: none;
    padding: 8px 18px; border-radius: 999px;
    background: rgba(6, 12, 22, .78); border: 1px solid rgba(0, 240, 255, .35);
    color: #9fe8ff; font: 600 13px/1 'JetBrains Mono', Consolas, monospace;
    letter-spacing: .5px; box-shadow: 0 0 18px rgba(0, 240, 255, .18);
    opacity: 0; transition: opacity .2s ease, transform .2s ease;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ============ 覆盖层（开始 / 暂停） ============ */
  #overlay {
    position: fixed; inset: 0; z-index: 30;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background:
      radial-gradient(circle at 50% 42%, rgba(0, 90, 130, .17), transparent 62%),
      rgba(3, 6, 11, .93);
    backdrop-filter: blur(3px);
    text-align: center;
    cursor: pointer;
    transition: opacity .35s ease;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }

  #overlay h1 {
    font-size: clamp(34px, 7vw, 74px);
    font-weight: 800; letter-spacing: .16em;
    background: linear-gradient(100deg, #7df9ff, #b39dff 48%, #ff8fc4);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 26px rgba(0, 200, 255, .35));
  }
  #overlay .sub {
    margin-top: 10px; font-size: 12px; letter-spacing: .42em;
    color: #4c6b8c; text-transform: uppercase;
  }
  #overlay .rule {
    width: min(420px, 76vw); height: 1px; margin: 30px 0;
    background: linear-gradient(90deg, transparent, rgba(0, 240, 255, .55), transparent);
  }
  #overlay .keys {
    display: grid; grid-template-columns: repeat(2, auto);
    gap: 9px 40px; font-size: 12.5px; color: #6d89a8;
    text-align: left;
  }
  #overlay .keys div { display: flex; align-items: center; gap: 10px; }
  #overlay kbd {
    display: inline-block; min-width: 26px; padding: 3px 7px;
    border: 1px solid rgba(0, 240, 255, .3); border-radius: 3px;
    background: rgba(0, 240, 255, .06);
    font-family: Consolas, monospace; font-size: 11px; color: #9fe8ff;
    text-align: center;
  }
  #overlay .cta {
    margin-top: 34px; font-size: 13px; letter-spacing: .3em;
    color: #00f0ff; animation: breathe 2.2s ease-in-out infinite;
  }
  @keyframes breathe { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }

  #overlay .tip {
    margin-top: 26px; font-size: 11.5px; color: #3f5a78; line-height: 1.9; max-width: 420px;
  }

  /* 移动端提示 */
  #touchHint {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
    font-size: 11px; color: #3f5a78; z-index: 11; display: none;
  }
  @media (max-width: 820px) {
    #mapWrap { width: 108px; } #minimap { width: 108px; height: 108px; }
    #vitals { width: 180px; }
    #ammo { font-size: 26px; }
    #touchHint { display: block; }
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<!-- ==================== HUD ==================== -->
<div id="hud">
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div id="crosshair"></div>

  <div id="mapWrap">
    <canvas id="minimap" width="336" height="336"></canvas>
    <div id="explored">区域已探索 <b id="exploredVal">0%</b></div>
  </div>

  <div id="status">
    <div>任务 · <b>清剿残存单位</b></div>
    <div class="kill">击杀 <b id="kills">0</b></div>
    <div>存活单位 <b id="alive">0</b></div>
  </div>

  <div id="vitals">
    <div class="bar-label"><span>护盾 SHIELD</span><b id="shieldTxt">100</b></div>
    <div class="bar"><i id="shieldFill"></i></div>
    <div class="bar-label"><span>生命 HEALTH</span><b id="healthTxt">100</b></div>
    <div class="bar"><i id="healthFill"></i></div>
  </div>

  <div id="weapon">
    <div id="weaponName">BRATON · 自动步枪</div>
    <div id="ammo">30<span> / 30</span></div>
  </div>

  <div id="perf"><b id="fps">60</b> FPS · <span id="frameMs">16.7</span> ms</div>
</div>

<div id="damageFlash"></div>
<div id="toast"></div>
<div id="touchHint">移动端可用左侧摇杆移动 · 右侧滑动转向</div>

<!-- ==================== 开始 / 暂停 ==================== -->
<div id="overlay">
  <h1>ASTRA FRAME</h1>
  <div class="sub">星际战甲 · 遗迹清剿</div>

  <div class="rule"></div>

  <div class="keys">
    <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动</div>
    <div><kbd>鼠标</kbd> 转向瞄准</div>
    <div><kbd>Shift</kbd> 冲刺</div>
    <div><kbd>空格</kbd> 跳跃</div>
    <div><kbd>左键</kbd> 射击</div>
    <div><kbd>R</kbd> 换弹</div>
    <div><kbd>Esc</kbd> 暂停</div>
    <div><kbd>M</kbd> 静音</div>
    <div><kbd>[</kbd><kbd>]</kbd> 调整鼠标灵敏度</div>
    <div><kbd>V</kbd> 切换视角距离</div>
  </div>

  <div class="cta" id="cta">点击开始</div>
  <div class="tip">
    地图已被战争迷雾覆盖，仅能看见视野范围。向前推进以点亮区域，清剿全部残存单位。
  </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
